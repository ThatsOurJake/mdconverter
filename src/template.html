<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <title>Template</title>
  <style>
    :root {
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9dee3;
      --surface: #f6f8fa;
      --accent: #2b5fa5;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 11pt;
      line-height: 1.6;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    #container> :first-child {
      margin-top: 0;
    }

    /* Headings */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      line-height: 1.25;
      font-weight: 700;
      color: #111827;
      break-after: avoid;
      page-break-after: avoid;
    }

    h1 {
      font-size: 26pt;
      margin: 0 0 0.6em;
      padding-bottom: 0.3em;
      border-bottom: 2px solid var(--border);
    }

    h2 {
      font-size: 18pt;
      margin: 1.8em 0 0.5em;
      padding-bottom: 0.25em;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 14pt;
      margin: 1.5em 0 0.4em;
    }

    h4,
    h5,
    h6 {
      font-size: 11.5pt;
      margin: 1.3em 0 0.3em;
    }

    h6 {
      color: var(--muted);
    }

    /* Text */
    p {
      margin: 0 0 0.8em;
      orphans: 3;
      widows: 3;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    strong {
      font-weight: 600;
    }

    hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 2em 0;
    }

    ul,
    ol {
      margin: 0 0 0.8em;
      padding-left: 1.6em;
    }

    li {
      margin: 0.3em 0;
    }

    li>ul,
    li>ol {
      margin: 0.3em 0 0;
    }

    blockquote {
      margin: 1em 0;
      padding: 0.6em 1em;
      background: var(--surface);
      border-left: 4px solid var(--accent);
      border-radius: 0 6px 6px 0;
      color: var(--muted);
      break-inside: avoid;
    }

    blockquote> :last-child {
      margin-bottom: 0;
    }

    /* Code */
    :not(pre)>code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      padding: 0.1em 0.35em;
      background: #eef1f4;
      border: 1px solid #e1e5ea;
      border-radius: 4px;
      color: #b42318;
      overflow-wrap: anywhere;
    }

    pre {
      margin: 1em 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      break-inside: avoid;
    }

    pre code,
    pre code.hljs {
      display: block;
      padding: 0.8em 1em;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 9pt;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: visible;
    }

    /* Images and diagrams */
    img {
      max-height: 40rem;
      max-width: 100%;
      margin: 1.2em auto;
      display: block;
      border: 1px solid var(--border);
      border-radius: 4px;
      break-inside: avoid;
    }

    .mermaid {
      margin: 1.2em 0;
      text-align: center;
      break-inside: avoid;
    }

    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    /* Tables */
    table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin: 1em 0;
      font-size: 0.92em;
      line-height: 1.5;
    }

    thead {
      display: table-header-group;
    }

    tr {
      break-inside: avoid;
    }

    th,
    td {
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    th {
      background: #eef1f4;
      font-weight: 600;
      border-top: 1px solid var(--border);
      border-bottom: 2px solid #b8c1cc;
    }

    tbody tr:nth-child(even) {
      background: #fafbfc;
    }

    td> :last-child,
    th> :last-child {
      margin-bottom: 0;
    }

    .pagebreak {
      break-before: page;
      page-break-before: always;
    }

    @media print {
      #container {
        max-width: none;
        padding: 0;
      }
    }
  </style>
</head>

<body>
  <div id="container"></div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.37.1/minified.min.js"
  integrity="sha512-hzBfnFOnhpm6z1mmp0JJuh2LIyOyFL06ldOg4BgJLKiARAPO38w2I0FV2HNAtoanuiPcLt+FA7nr0sYXcjGSDw=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.min.js"
  integrity="sha256-IXtm70J5wzwUG0r+Iu/60QqRwCVY3HCRe+LAmB547Yc=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
<script>
  // body[data-ready] tells the PDF renderer that fonts and diagrams have finished.
  mermaid.initialize({
    startOnLoad: false,
    logLevel: 3,
    theme: 'base',
    fontFamily: 'Inter, Helvetica, Arial, sans-serif',
    themeVariables: {
      primaryColor: '#eef1f4',
      primaryBorderColor: '#8aa0b8',
      primaryTextColor: '#1f2933',
      lineColor: '#52606d',
      textColor: '#1f2933'
    }
  });
  Promise.all([mermaid.run(), document.fonts.ready])
    .catch(() => { })
    .then(() => { document.body.dataset.ready = 'true'; });
</script>

</html>
